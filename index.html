<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Daily Site Safety Inspection Checklist — Konart Steel Buildings</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root{
  --navy:#0A2647;
  --navy-2:#123863;
  --orange:#C1440E;
  --orange-soft:#F5E2D6;
  --bg:#FFFFFF;
  --bg-soft:#F6F7F9;
  --text:#23262B;
  --muted:#6B7280;
  --border:#DCE0E5;
  --green:#1F7A3F;
  --green-bg:#E7F4EC;
  --red:#B3261E;
  --red-bg:#FBEAE9;
  --amber:#9A6B00;
  --amber-bg:#FDF3DC;
  --grey-bg:#EEF0F3;
  --radius:6px;
  --shadow:0 1px 3px rgba(20,30,45,0.08);
  font-size:16px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;
  background:var(--bg-soft);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  line-height:1.45;
}
#app{min-height:100vh;display:flex;flex-direction:column;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:0.94rem;}
.req{color:var(--red);margin-left:2px;}
.muted{color:var(--muted);}
.small{font-size:0.8rem;}

/* ---------- Header / Brand ---------- */
.brand-header{background:#fff;border-bottom:1px solid var(--border);}
.brand-header-inner{
  max-width:960px;margin:0 auto;padding:14px 16px 10px;
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
}
.logo-box{
  background:#fff;border:1px solid var(--border);border-radius:4px;
  padding:6px 10px;display:flex;align-items:center;
}
.logo-box img{height:34px;width:auto;display:block;}
.brand-right{text-align:right;}
.brand-name{font-weight:800;color:var(--navy);font-size:1.02rem;letter-spacing:0.2px;}
.brand-tagline{color:var(--orange);font-style:italic;font-size:0.78rem;margin-top:2px;}
.title-bar{background:var(--navy);}
.title-bar-inner{max-width:960px;margin:0 auto;padding:10px 16px;text-align:center;}
.title-bar-inner h2{color:#fff;font-size:1.15rem;margin:0 0 3px;letter-spacing:0.4px;font-weight:800;}
.title-bar-inner p{color:#FFCDB2;margin:0;font-size:0.82rem;}

.top-nav{display:flex;gap:0;background:var(--navy-2);}
.top-nav-btn{flex:1;background:transparent;border:none;color:#CFE0F0;padding:9px 10px;font-size:0.8rem;font-weight:600;border-bottom:2px solid transparent;}
.top-nav-btn.active{color:#fff;border-bottom-color:var(--orange);background:rgba(255,255,255,0.06);}

/* ---------- Shell / layout ---------- */
.shell{max-width:960px;margin:0 auto;padding:20px 16px 110px;width:100%;flex:1;}
.page-title{font-size:1.4rem;margin:0 0 4px;color:var(--navy);font-weight:800;}
.page-sub{color:var(--muted);margin:0;font-size:0.9rem;}
.dash-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px;}

/* ---------- Buttons ---------- */
.btn{border-radius:var(--radius);border:1px solid transparent;padding:10px 16px;font-weight:600;font-size:0.9rem;transition:filter .12s ease;}
.btn:active{filter:brightness(0.94);}
.btn:disabled{opacity:0.4;cursor:not-allowed;}
.btn-primary{background:var(--navy);color:#fff;}
.btn-accent{background:var(--orange);color:#fff;}
.btn-outline{background:#fff;color:var(--navy);border-color:var(--navy);}
.btn-ghost{background:var(--grey-bg);color:var(--text);}
.btn-text{background:transparent;color:var(--text);border:none;}
.btn-text.danger{color:var(--red);}
.btn-link{background:none;border:none;color:var(--navy-2);font-weight:600;font-size:0.85rem;padding:4px 6px;}
.btn-link.danger{color:var(--red);}

/* ---------- Stat grid ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px;}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px 12px;text-align:center;box-shadow:var(--shadow);}
.stat-num{display:block;font-size:1.5rem;font-weight:800;color:var(--navy);}
.stat-label{display:block;font-size:0.74rem;color:var(--muted);margin-top:2px;}

/* ---------- Filter row ---------- */
.filter-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.filter-row input,.filter-row select{flex:1;min-width:180px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);background:#fff;}

/* ---------- Table ---------- */
.table-wrap{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
.data-table{width:100%;border-collapse:collapse;}
.data-table th{background:var(--navy);color:#fff;text-align:left;font-size:0.78rem;padding:10px 12px;font-weight:700;}
.data-table td{padding:10px 12px;border-top:1px solid var(--border);font-size:0.86rem;vertical-align:top;}
.row-actions{white-space:nowrap;}

.empty-state{background:#fff;border:1px dashed var(--border);border-radius:var(--radius);padding:40px 20px;text-align:center;}
.empty-state p{margin:4px 0;}

/* ---------- Badges ---------- */
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:0.72rem;font-weight:700;letter-spacing:0.3px;}
.badge-grey{background:var(--grey-bg);color:#4B5563;}
.badge-blue{background:#E3EBF5;color:var(--navy-2);}
.badge-amber{background:var(--amber-bg);color:var(--amber);}
.badge-green{background:var(--green-bg);color:var(--green);}
.badge-red{background:var(--red-bg);color:var(--red);}

/* ---------- Form top / stepper ---------- */
.form-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.stepper{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:16px;-webkit-overflow-scrolling:touch;}
.step-pill{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--border);border-radius:20px;padding:7px 12px 7px 7px;font-size:0.78rem;color:var(--muted);white-space:nowrap;}
.step-pill .step-num{width:20px;height:20px;border-radius:50%;background:var(--grey-bg);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:0.7rem;font-weight:700;}
.step-pill.active{border-color:var(--navy);color:var(--navy);font-weight:700;}
.step-pill.active .step-num{background:var(--navy);color:#fff;}
.step-pill.done .step-num{background:var(--green);color:#fff;}
.step-pill.done{color:var(--green);}

.step-panel{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:18px 16px;box-shadow:var(--shadow);}
.step-title{margin:0 0 6px;color:var(--navy);font-size:1.1rem;font-weight:800;}
.sub-title{margin:22px 0 10px;color:var(--navy);font-size:0.98rem;font-weight:700;}
.step-desc{color:var(--muted);font-size:0.85rem;margin:0 0 16px;}

.wizard-nav{display:flex;align-items:center;justify-content:space-between;margin-top:16px;}
.wizard-progress{color:var(--muted);font-size:0.82rem;}

/* ---------- Field grid ---------- */
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;}
.field-grid.tight{grid-template-columns:1fr 1fr;gap:8px 10px;margin-top:8px;}
.field-grid.tight p{margin:0;font-size:0.86rem;}
.field{display:flex;flex-direction:column;gap:5px;}
.field-wide{grid-column:1 / -1;}
.field-label{font-size:0.78rem;font-weight:600;color:#374151;}
.field input,.field select,.field textarea{
  padding:9px 10px;border:1px solid var(--border);border-radius:var(--radius);background:#fff;color:var(--text);width:100%;resize:vertical;
}
.field input:focus,.field select:focus,.field textarea:focus,.filter-row input:focus,.filter-row select:focus{
  outline:2px solid var(--navy-2);outline-offset:1px;border-color:var(--navy-2);
}

/* ---------- Checklist cards ---------- */
.check-list{display:flex;flex-direction:column;gap:12px;}
.check-card{border:1px solid var(--border);border-radius:var(--radius);padding:12px;background:#fff;}
.check-card.flagged{border-color:var(--red);background:var(--red-bg);}
.check-card-head{display:flex;gap:10px;margin-bottom:10px;}
.check-no{flex:0 0 auto;background:var(--navy);color:#fff;font-size:0.72rem;font-weight:700;padding:3px 7px;border-radius:4px;height:fit-content;}
.check-text{margin:0;font-size:0.92rem;color:var(--text);font-weight:500;}
.segmented{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px;}
.seg{padding:12px 6px;border-radius:var(--radius);border:1.5px solid var(--border);background:#fff;font-weight:700;font-size:0.82rem;color:var(--muted);min-height:44px;}
.seg-yes.active{background:var(--green);border-color:var(--green);color:#fff;}
.seg-no.active{background:var(--red);border-color:var(--red);color:#fff;}
.seg-na.active{background:#6B7280;border-color:#6B7280;color:#fff;}
.no-panel{margin-top:10px;padding-top:10px;border-top:1px dashed var(--red);}
.no-flag{color:var(--red);font-weight:700;font-size:0.82rem;margin:0 0 6px;}

/* ---------- Observations ---------- */
.obs-list{display:flex;flex-direction:column;gap:12px;margin-bottom:14px;}
.obs-card{border:1px solid var(--border);border-radius:var(--radius);padding:12px;background:#fff;}
.obs-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.obs-tag{font-size:0.7rem;font-weight:700;padding:3px 8px;border-radius:12px;}
.tag-auto{background:var(--red-bg);color:var(--red);}
.tag-manual{background:#E3EBF5;color:var(--navy-2);}

/* ---------- Summary ---------- */
.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.sum-card{background:var(--bg-soft);border:1px solid var(--border);border-radius:var(--radius);padding:14px 10px;text-align:center;}
.sum-card.good{background:var(--green-bg);}
.sum-card.bad{background:var(--red-bg);}
.sum-card.neutral{background:var(--grey-bg);}
.sum-card.accent{background:var(--orange-soft);}
.sum-num{display:block;font-size:1.35rem;font-weight:800;color:var(--navy);}
.sum-label{display:block;font-size:0.72rem;color:var(--muted);margin-top:2px;}
.warn-line{color:var(--red);font-weight:600;font-size:0.85rem;margin-top:12px;}
.declaration-box{background:var(--bg-soft);border-left:4px solid var(--orange);border-radius:4px;padding:14px 16px;}
.declaration-box p{margin:0;font-style:italic;color:#374151;font-size:0.92rem;}

/* ---------- Responsible Persons ---------- */
.person-block{border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px;background:#fff;}
.person-role-title{margin:0 0 10px;color:var(--navy);font-size:0.95rem;font-weight:700;}

/* ---------- Who's filling this / mini preview ---------- */
.mini-batch{display:flex;flex-direction:column;gap:4px;margin-top:8px;}
.mini-batch-row{font-size:0.82rem;}

/* ---------- Approval & Verification batch ---------- */
.notice{border-radius:var(--radius);padding:12px 14px;font-size:0.85rem;margin-bottom:16px;}
.notice ul{margin:6px 0 0;padding-left:18px;}
.notice-warn{background:var(--amber-bg);color:#6B4E00;border:1px solid #EAD9A8;}
.notice-ok{background:var(--green-bg);color:var(--green);border:1px solid #BFE3CB;}
.notice-info{background:var(--bg-soft);color:#374151;border:1px solid var(--border);}
.history-list{display:flex;flex-direction:column;gap:8px;margin-bottom:6px;}
.history-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;font-size:0.82rem;}
.history-role{font-weight:600;}
.history-time{margin-left:auto;}

.approval-batch{display:flex;flex-direction:column;gap:12px;margin-bottom:16px;}
.batch-row{display:flex;gap:12px;border:1px solid var(--border);border-radius:var(--radius);padding:14px;background:#fff;align-items:flex-start;}
.batch-row.batch-approved{border-color:var(--orange);background:var(--orange-soft);}
.batch-row.batch-rejected{border-color:var(--red);background:var(--red-bg);}
.batch-icon{flex:0 0 auto;padding-top:2px;}
.batch-info{flex:1;min-width:0;}
.batch-role{font-weight:700;color:var(--navy);font-size:0.92rem;}
.batch-name-line{display:flex;align-items:center;gap:6px;margin-top:2px;}
.batch-name{font-size:0.88rem;color:var(--text);font-weight:600;}
.batch-name-icon{display:inline-flex;flex:0 0 auto;}
.batch-status-text{font-size:0.8rem;font-weight:700;margin-top:4px;}
.batch-approved .batch-status-text{color:var(--orange);}
.batch-rejected .batch-status-text{color:var(--red);}
.batch-pending .batch-status-text{color:var(--muted);}
.batch-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;}
.approval-code{background:var(--grey-bg);border-radius:4px;padding:3px 7px;font-size:0.74rem;color:#4B5563;}
.btn-sm{padding:7px 10px;font-size:0.78rem;}
.verified-badge-svg{display:block;}

.final-status-banner{
  text-align:center;font-weight:800;font-size:0.95rem;letter-spacing:0.3px;
  border-radius:var(--radius);padding:12px;color:#fff;margin:10px 0 6px;
}
.final-status-banner.status-approved{background:var(--orange);}
.final-status-banner.status-not-approved{background:var(--red);}
.final-status-banner.status-pending-approval{background:#8A8F98;}

/* ---------- Inbox decision / confirmation panel ---------- */
.confirm-panel{border:1px dashed var(--border);border-radius:var(--radius);padding:14px;margin-top:14px;background:var(--bg-soft);}
.confirm-panel p{margin:4px 0;}

/* ---------- Sticky action bar ---------- */
.action-bar{
  position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--border);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;flex-wrap:wrap;
  justify-content:center;box-shadow:0 -2px 8px rgba(0,0,0,0.06);z-index:20;
}
.action-bar .btn{flex:1 1 auto;min-width:110px;font-size:0.82rem;padding:11px 10px;}

.app-footer{text-align:center;color:var(--muted);font-size:0.75rem;padding:18px 12px 130px;}

.toast{
  position:fixed;bottom:78px;left:50%;transform:translateX(-50%);
  background:var(--navy);color:#fff;padding:10px 18px;border-radius:20px;font-size:0.84rem;
  box-shadow:0 4px 14px rgba(0,0,0,0.2);z-index:50;
}

/* ---------- Responsive ---------- */
@media (min-width:720px){
  .field-grid,.field-grid.tight{grid-template-columns:1fr 1fr 1fr;}
}
@media (max-width:640px){
  .stat-grid{grid-template-columns:repeat(2,1fr);}
  .field-grid,.field-grid.tight{grid-template-columns:1fr;}
  .summary-grid{grid-template-columns:repeat(2,1fr);}
  .data-table thead{display:none;}
  .data-table tr{display:block;border-top:1px solid var(--border);padding:10px 0;}
  .data-table td{display:flex;justify-content:space-between;gap:10px;padding:4px 12px;border-top:none;font-size:0.84rem;}
  .data-table td::before{content:attr(data-label);font-weight:700;color:var(--muted);font-size:0.72rem;}
  .brand-header-inner{flex-direction:column;align-items:flex-start;}
  .brand-right{text-align:left;}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important;}}

</style>
</head>

      { no: '6.2', text: 'Slings, shackles, lifting gear in good condition and colour-coded' },
      { no: '6.3', text: 'Signalman present during lifting operations' },
      { no: '6.4', text: 'Vehicles / mobile equipment inspected; drivers competent' },
    ],
  },
];

const TOTAL_ITEMS = CHECKLIST_SECTIONS.reduce((n, s) => n + s.items.length, 0);

const WIZARD_STEPS = [
  { key: 'site', label: 'Site Information' },
  { key: 'people', label: 'Responsible Persons' },
  { key: 'identity', label: 'Who\u2019s Filling This' },
  { key: 'sec1', label: 'General Conditions' },
  { key: 'sec2', label: 'PPE & Welfare' },
  { key: 'sec3', label: 'Work at Height' },
  { key: 'sec5', label: 'Electrical & Hot Work' },
  { key: 'sec6', label: 'Lifting & Vehicles' },
  { key: 'observations', label: 'Observations' },
  { key: 'summary', label: 'Summary & Declaration' },
  { key: 'submit', label: 'Approval & Verification' },
];

const FILLER_ROLES = ['Safety Incharge', 'Site Incharge']; // who can actually fill the checklist
const WEATHER_OPTIONS = ['Sunny', 'Cloudy', 'Partly Cloudy', 'Rainy', 'Windy', 'Foggy', 'Hot & Humid', 'Clear'];
const ROLES = ['Safety Incharge', 'Inspected by', 'Site Incharge']; // rows shown in the Approval & Verification batch
const PERSON_KEY = { 'Safety Incharge': 'safetyIncharge', 'Site Incharge': 'siteIncharge' };

const STATUS_FLOW = ['DRAFT', 'PENDING APPROVAL', 'APPROVED', 'COMPLETED'];

/* ---------- Utilities ---------- */
function uid(prefix) {
  return (prefix || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
/* Short, easy-to-type/share code for approval requests (no ambiguous chars). */
function shortCode(len) {
  const alphabet = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
  let out = '';
  for (let i = 0; i < (len || 7); i++) out += alphabet[Math.floor(Math.random() * alphabet.length)];
  return out;
}
function pad2(n) { return String(n).padStart(2, '0'); }
function todayISO() {
  const d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function nowHM() {
  const d = new Date();
  return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
/* Merged date+time field helpers — the Site Information step uses one
   <input type="datetime-local"> instead of separate date/time inputs. */
function nowDateTimeLocal() {
  return todayISO() + 'T' + nowHM();
}
function splitDateTime(dt) {
  if (!dt) return { date: '', time24: '' };
  const parts = String(dt).split('T');
  return { date: parts[0] || '', time24: parts[1] || '' };
}
function fmtTime12h(time24) {
  if (!time24) return '';
  const bits = time24.split(':');
  let h = parseInt(bits[0], 10);
  const m = bits[1] || '00';
  if (isNaN(h)) return time24;
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if (h === 0) h = 12;
  return `${h}:${m} ${ampm}`;
}
function siteDateTimeParts(insp) {
  const { date, time24 } = splitDateTime(insp.site.datetime);
  return { date, time24, time12: fmtTime12h(time24) };
}
function fmtDateDMY(iso) {
  if (!iso) return '—';
  const [y, m, d] = iso.split('-');
  if (!y || !m || !d) return iso;
  return `${d}-${m}-${y}`;
}
function nowStamp() {
  const d = new Date();
  return { date: fmtDateDMY(todayISO()), time: pad2(d.getHours()) + ':' + pad2(d.getMinutes()) };
}
/* Forgive whatever shape of URL someone pastes into the Backend URL field —
   strip a trailing /health, /api/... path, and any trailing slashes, so
   entering the exact base origin isn't something the person has to get
   perfectly right by hand. */
function normalizeBackendUrl(url) {
  return String(url || '').trim().replace(/\/(health|api)(\/.*)?$/i, '').replace(/\/+$/, '');
}

function escapeHtml(str) {
  return String(str == null ? '' : str).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}
function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

/* ---------- Data model ---------- */
function newChecklistItemState(item) {
  return {
    no: item.no,
    text: item.text,
    result: '',        // 'YES' | 'NO' | 'NA'
    remarks: '',
    correctiveAction: '',
    responsible: '',
    targetDate: '',
    status: 'Open',     // Open | In Progress | Closed
  };
}

function newInspection() {
  const stamp = nowStamp();
  const checklist = {};
  CHECKLIST_SECTIONS.forEach((s) => {
    checklist[s.id] = s.items.map(newChecklistItemState);
  });
  return {
    id: uid('insp'),
    createdAt: new Date().toISOString(),
    status: 'DRAFT',
    lastStep: 0, // resume here next time this draft is opened, instead of jumping back to step 1
    filler: { role: '' }, // one of ROLES — who is physically filling this checklist
    identityConfirmedAt: null, // {date, time}
    referenceCode: null, // {site, date, time, seq} — assigned once, on first PDF generation
    people: {
      safetyIncharge: { name: '', email: '' },
      siteIncharge: { name: '', email: '' },
    },
    site: {
      siteNameNo: '',
      client: '',
      workOrderNo: '',
      location: '',
      datetime: nowDateTimeLocal(),
      workersCount: '',
      contractor: '',
      shift: 'Day',
      weather: '',
      activities: '',
    },
    checklist,
    observations: [], // {id, itemNo, source:'auto'|'manual', text, correctiveAction, responsible, targetDate, status}
    approvals: [], // remote approval requests only — {id, role, email, status:'PENDING'|'APPROVED'|'REJECTED', requestedDate, requestedTime, respondedName, respondedDate, respondedTime, reason}
    approvalHistory: [], // {role, name, status, date, time, note} — chronological activity log
  };
}

/* ---------- Approval requirement table (the core business rule) ----------
   Only Safety Incharge or Site Incharge can fill the checklist. Whoever
   does is treated as the person who carried out the inspection, so
   "Inspected by" is always auto-approved under their name — there's no
   separate inspector identity to confirm. The role NOT filling it still
   needs a real remote approval. */
function approvalRequirement(role, fillerRole) {
  if (role === 'Inspected by') return 'implicit';
  if (role === fillerRole) return 'self';
  return 'remote';
}

/* Which name to show for a role's slot in the Approval & Verification batch.
   "Inspected by" always shows whoever is actually filling the checklist. */
function roleDisplayName(insp, role) {
  if (role === 'Inspected by') {
    return insp.filler.role ? insp.people[PERSON_KEY[insp.filler.role]].name : '';
  }
  return insp.people[PERSON_KEY[role]].name;
}

/* Full computed Approval & Verification batch — the single source of truth
   the Submit step, the inbox, and the PDF all read from. */
function computeApprovalBatch(insp) {
  // Only the two real people get a row here — "Inspected by" is never a
  // separate row, since it's always the same person as whoever filled the
  // checklist. Showing it again as its own line just duplicated a name
  // that was already right there under their actual role.
  return FILLER_ROLES.map((role) => {
    const req = approvalRequirement(role, insp.filler.role);
    const person = insp.people[PERSON_KEY[role]];
    const isFiller = role === insp.filler.role;
    if (req === 'self') {
      const stamp = insp.identityConfirmedAt || nowStamp();
      return {
        role, requirement: req, email: person.email, name: person.name,
        alsoInspected: isFiller,
        status: 'APPROVED', respondedName: person.name,
        respondedDate: stamp.date, respondedTime: stamp.time,
        note: 'Self-verified — present, filled the checklist, and carried out the inspection.',
      };
    }
    const remote = insp.approvals.find((a) => a.role === role);
    return {
      role, requirement: 'remote', email: person.email, name: person.name,
      status: remote ? remote.status : 'PENDING', // PENDING here just means "not yet sent"
      respondedName: remote ? remote.respondedName : '', respondedDate: remote ? remote.respondedDate : '',
      respondedTime: remote ? remote.respondedTime : '', reason: remote ? remote.reason : '',
      approvalId: remote ? remote.id : null, sent: !!remote,
      emailDevMode: remote ? !!remote.emailDevMode : false,
    };
  });
}

function finalStatusLabel(insp) {
  const batch = computeApprovalBatch(insp);
  if (batch.some((b) => b.status === 'REJECTED')) return 'NOT APPROVED';
  if (batch.every((b) => b.status === 'APPROVED')) return 'APPROVED';
  return 'PENDING APPROVAL';
}

/* ---------- Identity confirmation ---------- */
function applyIdentity(insp, role) {
  insp.filler = { role };
  const stamp = nowStamp();
  insp.identityConfirmedAt = stamp;
  insp.approvalHistory.push({
    role, name: roleDisplayName(insp, role), status: 'APPROVED', date: stamp.date, time: stamp.time,
    note: `Confirmed identity as ${role} — carrying out this inspection.`,
  });
  recomputeStatus(insp);
}

/* ---------- Local key-value storage, with a real fallback ----------
   window.storage only exists inside Claude.ai's own Artifact viewer. This
   file is meant to be downloaded and self-hosted (GitHub Pages, etc.), and
   in a plain browser tab window.storage doesn't exist at all — every read
   and write would silently fail, which is exactly what "data disappears on
   refresh" looks like. localStorage is the real, always-available browser
   API for this, so we use window.storage when it's actually present (nicer
   within Claude.ai) and fall back to localStorage everywhere else. */
/* Your backend, baked in as the default. This means every copy of this
   file — a fresh download, a different browser, even a new file:// path
   (which some browsers treat as a brand-new storage context, wiping
   whatever was saved before) — connects automatically with no Settings
   step required. You can still override it anytime from ⚙ Settings; that
   override is what gets saved and takes priority from then on. */
const DEFAULT_BACKEND_URL = 'https://daily-inspection-checklist.onrender.com';
const DEFAULT_API_KEY = 'af9ba84564cfeeef7498f99703cd02a9';

const LocalKV = {
  hasNative() {
    return typeof window !== 'undefined' && !!window.storage && typeof window.storage.get === 'function';
  },
  lsKey(key, shared) { return 'ksbpl:' + (shared ? 'shared:' : 'local:') + key; },
  async get(key, shared) {
    if (LocalKV.hasNative()) return window.storage.get(key, shared);
    const raw = localStorage.getItem(LocalKV.lsKey(key, shared));
    if (raw == null) throw new Error('not found'); // matches window.storage's own throw-on-missing contract
    return { key, value: raw, shared: !!shared };
  },
  async set(key, value, shared) {
    if (LocalKV.hasNative()) return window.storage.set(key, value, shared);
    localStorage.setItem(LocalKV.lsKey(key, shared), value);
    return { key, value, shared: !!shared };
  },
  async delete(key, shared) {
    if (LocalKV.hasNative()) return window.storage.delete(key, shared);
    localStorage.removeItem(LocalKV.lsKey(key, shared));
    return { key, deleted: true, shared: !!shared };
  },
};

/* ---------- Backend connection (optional) ----------
   If no backend is configured, everything falls back to the artifact's
   built-in storage (window.storage) so the app still works standalone.
   Configure a backend from the ⚙ Settings page — no code editing needed. */
const Backend = {
  configured() { return !!(App.settings && App.settings.apiBaseUrl); },

  async loadSettings() {
    try {
      const res = await LocalKV.get('settings:backend');
      return res ? JSON.parse(res.value) : { apiBaseUrl: DEFAULT_BACKEND_URL, apiKey: DEFAULT_API_KEY };
    } catch (e) { return { apiBaseUrl: DEFAULT_BACKEND_URL, apiKey: DEFAULT_API_KEY }; }
  },
  async saveSettings(settings) {
    try { await LocalKV.set('settings:backend', JSON.stringify(settings)); return true; } catch (e) { return false; }
  },

  url(path) {
    return normalizeBackendUrl(App.settings.apiBaseUrl) + path;
  },
  async fetch(path, opts) {
    opts = opts || {};
    const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
    if (App.settings.apiKey) headers['x-api-key'] = App.settings.apiKey;
    const res = await fetch(Backend.url(path), Object.assign({}, opts, { headers }));
    let body = null;
    try { body = await res.json(); } catch (e) { /* no body */ }
    if (!res.ok) {
      const err = new Error((body && body.error) || `Request failed (${res.status})`);
      err.status = res.status;
      throw err;
    }
    return body;
  },
  async testConnection(explicitUrl, explicitKey) {
    const base = normalizeBackendUrl(explicitUrl || App.settings.apiBaseUrl || '');
    const key = explicitKey != null ? explicitKey : App.settings.apiKey;
    try {
      const res = await fetch(base + '/health');
      const body = await res.json();
      if (!res.ok || !body.ok) return { ok: false, reason: 'unreachable' };
    } catch (e) { return { ok: false, reason: 'unreachable', error: String(e) }; }

    // /health doesn't need a key, so reaching it proves nothing about
    // whether the API Key is actually right — check a protected route too.
    try {
      const headers = {};
      if (key) headers['x-api-key'] = key;
      const res2 = await fetch(base + '/api/inspections', { headers });
      if (res2.status === 401) return { ok: false, reason: 'unauthorized' };
      if (!res2.ok) return { ok: false, reason: 'error', status: res2.status };
      return { ok: true };
    } catch (e) { return { ok: false, reason: 'error', error: String(e) }; }
  },
};

/* ---------- Persistent storage ----------
   Uses the connected backend when configured, otherwise the artifact's
   built-in key-value store (window.storage). Same interface either way, so
   the rest of the app doesn't need to know which one is active.

   Local storage always doubles as a durable cache, even when a backend is
   configured — a slow or sleeping backend (e.g. a free-tier host spinning
   up after inactivity) or a dropped connection should never make your data
   look like it vanished. Backend is the source of truth when reachable;
   local cache is what keeps things visible and editable when it isn't. */
const Store = {
  async listIds() {
    try {
      const res = await LocalKV.get('inspections-index');
      return res ? JSON.parse(res.value) : [];
    } catch (e) { return []; }
  },
  async saveIndex(ids) {
    try { await LocalKV.set('inspections-index', JSON.stringify(ids)); } catch (e) { /* noop */ }
  },
  async cacheLocally(insp) {
    try {
      await LocalKV.set('inspection:' + insp.id, JSON.stringify(insp));
      const ids = await Store.listIds();
      if (!ids.includes(insp.id)) { ids.push(insp.id); await Store.saveIndex(ids); }
      return true;
    } catch (e) { return false; }
  },
  async saveInspection(insp) {
    const localOk = await Store.cacheLocally(insp);
    if (Backend.configured()) {
      try {
        await Backend.fetch('/api/inspections', { method: 'POST', body: JSON.stringify(insp) });
        return true;
      } catch (e) {
        console.error('Backend save failed — kept locally instead:', e);
        return localOk; // not lost: it's in the local cache even though the backend didn't get it
      }
    }
    return localOk;
  },
  async loadInspection(id) {
    if (Backend.configured()) {
      try {
        const rec = await Backend.fetch('/api/inspections/' + encodeURIComponent(id));
        if (rec) await Store.cacheLocally(rec); // keep the local cache fresh
        return rec;
      } catch (e) {
        console.error('Backend load failed — falling back to local cache:', e);
        // fall through to local cache below
      }
    }
    try {
      const res = await LocalKV.get('inspection:' + id);
      return res ? JSON.parse(res.value) : null;
    } catch (e) { return null; }
  },
  async deleteInspection(id) {
    if (Backend.configured()) {
      try { await Backend.fetch('/api/inspections/' + encodeURIComponent(id), { method: 'DELETE' }); } catch (e) { /* noop */ }
    }
    try {
      await LocalKV.delete('inspection:' + id);
      const ids = await Store.listIds();
      await Store.saveIndex(ids.filter((x) => x !== id));
    } catch (e) { /* noop */ }
  },
  async loadLocalAll() {
    const ids = await Store.listIds();
    const out = [];
    for (const id of ids) {
      try {
        const res = await LocalKV.get('inspection:' + id);
        if (res) out.push(JSON.parse(res.value));
      } catch (e) { /* skip unreadable entry */ }
    }
    out.sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
    return out;
  },
  async loadAll() {
    if (Backend.configured()) {
      try {
        const list = await Backend.fetch('/api/inspections');
        for (const rec of list) await Store.cacheLocally(rec); // refresh local cache
        return list;
      } catch (e) {
        console.error('Backend list failed — showing local cache instead:', e);
        return await Store.loadLocalAll(); // never just show an empty dashboard over a network hiccup
      }
    }
    return await Store.loadLocalAll();
  },

  /* ---- Approval requests ----
     Backend mode: real HTTP endpoints, real email sent server-side, and the
     approver can open the code-review link from ANY device (no shared
     artifact storage needed).
     Local mode (no backend): shared artifact storage stands in for a
     server — visible to anyone with this app link — and email is composed
     via mailto: for you to send yourself. See the Submit step notice. */
  async approvalIndex() {
    try {
      const res = await LocalKV.get('approvals-index', true);
      return res ? JSON.parse(res.value) : [];
    } catch (e) { return []; }
  },
  async saveApprovalIndex(ids) {
    try { await LocalKV.set('approvals-index', JSON.stringify(ids), true); } catch (e) { /* noop */ }
  },
  async createApprovalRequest(payload) {
    // payload: { inspectionId, role, email, mobile, snapshot, requesterEmail }
    if (Backend.configured()) {
      return await Backend.fetch('/api/approvals', { method: 'POST', body: JSON.stringify(payload) });
    }
    const stamp = nowStamp();
    const rec = {
      id: shortCode(7), inspectionId: payload.inspectionId, role: payload.role,
      email: payload.email, mobile: payload.mobile || '', status: 'PENDING',
      requestedAt: new Date().toISOString(), requestedDate: stamp.date, requestedTime: stamp.time,
      respondedName: '', respondedDate: '', respondedTime: '', snapshot: payload.snapshot,
      requesterEmail: payload.requesterEmail || '',
    };
    await Store.saveApprovalRequest(rec);
    return rec;
  },
  async saveApprovalRequest(rec) {
    try {
      await LocalKV.set('approval-request:' + rec.id, JSON.stringify(rec), true);
      const ids = await Store.approvalIndex();
      if (!ids.includes(rec.id)) { ids.push(rec.id); await Store.saveApprovalIndex(ids); }
      return true;
    } catch (e) { return false; }
  },
  async loadApprovalRequest(id) {
    if (Backend.configured()) {
      try { return await Backend.fetch('/api/approvals/' + encodeURIComponent(id)); } catch (e) { return null; }
    }
    try {
      const res = await LocalKV.get('approval-request:' + id, true);
      return res ? JSON.parse(res.value) : null;
    } catch (e) { return null; }
  },
  async decideApprovalRequest(id, name, decision, reason, comment) {
    if (Backend.configured()) {
      return await Backend.fetch(`/api/approvals/${encodeURIComponent(id)}/decide`, {
        method: 'POST', body: JSON.stringify({ name, decision, reason: reason || '', comment: comment || '' }),
      });
    }
    const rec = await Store.loadApprovalRequest(id);
    if (!rec) return null;
    if (rec.status !== 'PENDING') throw new Error('This approval link has already been used.');
    const stamp = nowStamp();
    rec.status = decision; rec.respondedName = name; rec.respondedDate = stamp.date; rec.respondedTime = stamp.time;
    rec.reason = reason || '';
    rec.comment = comment || '';
    await Store.saveApprovalRequest(rec);
    return rec;
  },
  async loadApprovalsForInspection(inspectionId) {
    if (Backend.configured()) {
      try { return await Backend.fetch('/api/approvals?inspectionId=' + encodeURIComponent(inspectionId)); }
      catch (e) { return null; } // null = couldn't check (e.g. no key on this device) — caller should not overwrite local state
    }
    const all = await Store.loadAllApprovalRequests();
    return all.filter((r) => r.inspectionId === inspectionId);
  },
  async loadAllApprovalRequests() {
    if (Backend.configured()) {
      try { return await Backend.fetch('/api/approvals'); } catch (e) { return []; } // e.g. 401 on an approver's device with no key — that's fine, they use a code instead
    }
    const ids = await Store.approvalIndex();
    const out = [];
    for (const id of ids) {
      const rec = await Store.loadApprovalRequest(id);
      if (rec) out.push(rec);
    }
    out.sort((a, b) => (b.requestedAt || '').localeCompare(a.requestedAt || ''));
    return out;
  },

  /* Document reference sequence — a real backend counter when connected
     (unique across every device/person using it), with a local-only
     fallback so it still works offline. The fallback is honestly
     documented as such: it can't guarantee uniqueness across separate
     devices the way the backend counter does. */
  async getNextSequence() {
    if (Backend.configured()) {
      try {
        const res = await Backend.fetch('/api/next-sequence', { method: 'POST' });
        return res.value;
      } catch (e) {
        console.error('Sequence fetch from backend failed — using local counter instead:', e);
      }
    }
    let current = 0;
    try {
      const r = await LocalKV.get('local-doc-sequence');
      current = parseInt(r.value, 10) || 0;
    } catch (e) { current = 0; }
    const next = current + 1;
    try { await LocalKV.set('local-doc-sequence', String(next)); } catch (e) { /* best effort */ }
    return next;
  },
};

/* Assigns this inspection's permanent document reference code the first
   time it's needed (i.e. the first PDF for it), then reuses the same
   value forever after — a reference code that changed every time you
   reprinted the same document would defeat its whole purpose. */
async function ensureReferenceCode(insp) {
  if (insp.referenceCode) return insp.referenceCode;
  const now = new Date();
  const site = (insp.site.siteNameNo || 'SITE').trim().replace(/\s+/g, '') || 'SITE';
  const dateStr = pad2(now.getDate()) + pad2(now.getMonth() + 1) + now.getFullYear();
  const timeStr = pad2(now.getHours()) + pad2(now.getMinutes());
  const seqNum = await Store.getNextSequence();
  const seqStr = String(seqNum).padStart(4, '0');
  insp.referenceCode = { site, date: dateStr, time: timeStr, seq: seqStr };
  return insp.referenceCode;
}
function formatReferenceCode(ref) {
  if (!ref) return '';
  return `KSBPL/${ref.site}/${ref.date}/${ref.seq}/${ref.time}`;
}

/* ---------- Summary calculations ---------- */
function computeSummary(insp) {
  let yes = 0, no = 0, na = 0, blank = 0;
  CHECKLIST_SECTIONS.forEach((s) => {
    insp.checklist[s.id].forEach((it) => {
      if (it.result === 'YES') yes++;
      else if (it.result === 'NO') no++;
      else if (it.result === 'NA') na++;
      else blank++;
    });
  });
  const answered = yes + no;
  const compliance = answered > 0 ? Math.round((yes / answered) * 1000) / 10 : 0;
  const open = insp.observations.filter((o) => o.status !== 'Closed').length;
  const closed = insp.observations.filter((o) => o.status === 'Closed').length;
  return { total: TOTAL_ITEMS, yes, no, na, blank, compliance, open, closed, obsTotal: insp.observations.length };
}

/* Keep the auto-generated observation rows (from NO answers) in sync with the
   checklist, while preserving any edits made on manual rows and on the
   auto rows themselves. */
function syncAutoObservations(insp) {
  const manual = insp.observations.filter((o) => o.source !== 'auto');
  const existingAuto = {};
  insp.observations.filter((o) => o.source === 'auto').forEach((o) => { existingAuto[o.itemNo] = o; });

  const autoRows = [];
  CHECKLIST_SECTIONS.forEach((s) => {
    insp.checklist[s.id].forEach((it) => {
      if (it.result === 'NO') {
        const prior = existingAuto[it.no];
        autoRows.push({
          id: prior ? prior.id : uid('obs'),
          source: 'auto',
          itemNo: it.no,
          text: it.remarks || `Non-conformance observed at checklist item ${it.no} — ${it.text}`,
          correctiveAction: it.correctiveAction || '',
          responsible: it.responsible || '',
          targetDate: it.targetDate || '',
          status: it.status || 'Open',
        });
      }
    });
  });
  insp.observations = [...autoRows, ...manual];
}

/* ---------- Validation ---------- */
function validateRequired(insp) {
  const missing = [];
  const req = { siteNameNo: 'Site Name and No.', client: 'Client', location: 'Location', datetime: 'Inspection Date & Time' };
  Object.keys(req).forEach((k) => { if (!String(insp.site[k] || '').trim()) missing.push(req[k]); });

  FILLER_ROLES.forEach((role) => {
    const p = insp.people[PERSON_KEY[role]];
    if (!p.name.trim()) missing.push(`${role} name`);
    if (!p.email.trim()) missing.push(`${role} email`);
  });

  if (!insp.filler || !insp.filler.role) missing.push('Who is filling this checklist');

  let unanswered = 0;
  CHECKLIST_SECTIONS.forEach((s) => {
    insp.checklist[s.id].forEach((it) => { if (!it.result) unanswered++; });
  });
  if (unanswered > 0) missing.push(`${unanswered} inspection point(s) not marked Yes/No/N/A`);
  return missing;
}

/* Mandatory fields for ONE step, used to block "Next" until the current
   step is actually complete — rather than only catching gaps at the very
   end on the Submit step. */
function stepMissingFields(insp, stepKey) {
  const missing = [];
  if (stepKey === 'site') {
    const req = { siteNameNo: 'Site Name and No.', client: 'Client', location: 'Location', datetime: 'Inspection Date & Time' };
    Object.keys(req).forEach((k) => { if (!String(insp.site[k] || '').trim()) missing.push(req[k]); });
  } else if (stepKey === 'people') {
    FILLER_ROLES.forEach((role) => {
      const p = insp.people[PERSON_KEY[role]];
      if (!p.name.trim()) missing.push(`${role} name`);
      if (!p.email.trim()) missing.push(`${role} email`);
    });
  } else if (stepKey === 'identity') {
    if (!insp.filler || !insp.filler.role) missing.push('Who is filling this checklist');
  } else if (CHECKLIST_SECTIONS.some((s) => s.id === stepKey)) {
    const unanswered = insp.checklist[stepKey].filter((it) => !it.result).length;
    if (unanswered > 0) missing.push(`${unanswered} point(s) on this page not marked Yes/No/N/A`);
  }
  return missing;
}

/* ---------- Approval snapshot + mailto helpers ---------- */
function buildApprovalSnapshot(insp, forRole) {
  const sum = computeSummary(insp);
  const noItems = [];
  CHECKLIST_SECTIONS.forEach((sec) => {
    insp.checklist[sec.id].forEach((it) => {
      if (it.result === 'NO') {
        const ca = it.correctiveAction ? ` — Corrective action: ${it.correctiveAction}` : '';
        noItems.push(`${it.no} ${it.text}${ca}`);
      }
    });
  });
  return {
    siteNameNo: insp.site.siteNameNo, client: insp.site.client, location: insp.site.location,
    date: siteDateTimeParts(insp).date, time: siteDateTimeParts(insp).time12,
    inspector: roleDisplayName(insp, 'Inspected by'), siteIncharge: insp.people.siteIncharge.name, safetyIncharge: insp.people.safetyIncharge.name,
    contractor: insp.site.contractor, activities: insp.site.activities,
    filler: insp.filler, forRole: forRole || '', summary: sum, noItems,
    observations: insp.observations.map((o) => ({ text: o.text, correctiveAction: o.correctiveAction, status: o.status })),
  };
}

function recomputeStatus(insp) {
  if (insp.status === 'COMPLETED') return; // finalized, never auto-revert
  const label = finalStatusLabel(insp);
  insp.status = label === 'NOT APPROVED' ? 'REJECTED' : label;
}

/* ---------- Top-level render dispatcher ---------- */
/* Preserve whatever the user is typing into across a re-render. Our
   architecture replaces the whole view's innerHTML on every render(), which
   would otherwise steal focus (and cursor position) out from under someone
   mid-keystroke any time a render happens to fire for an unrelated reason. */
function captureFocus() {
  const active = document.activeElement;
  if (!active || !['INPUT', 'TEXTAREA', 'SELECT'].includes(active.tagName)) return null;
  let attr = null;
  if (active.getAttribute('data-bind')) attr = 'data-bind';
  else if (active.getAttribute('data-bind-obs')) attr = 'data-bind-obs';
  else if (active.id) attr = 'id';
  if (!attr) return null;
  const value = attr === 'id' ? active.id : active.getAttribute(attr);
  const selector = attr === 'id' ? `#${CSS.escape(value)}` : `[${attr}="${CSS.escape(value)}"]`;
  const out = { selector };
  if (typeof active.selectionStart === 'number') {
    out.start = active.selectionStart;
    out.end = active.selectionEnd;
  }
  return out;
}
function restoreFocus(captured) {
  if (!captured) return;
  const el = document.querySelector(captured.selector);
  if (!el) return;
  el.focus();
  if (captured.start != null && typeof el.setSelectionRange === 'function') {
    try { el.setSelectionRange(captured.start, captured.end); } catch (e) { /* not all input types support this */ }
  }
}

function render() {
  const focused = captureFocus();
  const r = root();
  if (App.view === 'dashboard') {
    r.innerHTML = renderDashboard();
  } else if (App.view === 'inbox') {
    r.innerHTML = renderInbox();
  } else if (App.view === 'inbox-detail') {
    r.innerHTML = renderInboxDetail();
  } else if (App.view === 'settings') {
    r.innerHTML = renderSettings();
  } else {
    r.innerHTML = renderForm();
    afterFormRender();
  }
  attachGlobalListeners();
  restoreFocus(focused);
}

function renderInboxDecided(r) {

  <div class="sig-actions" style="margin-top:10px;">

   FORM (WIZARD) VIEW
   ========================================================================= */

  <main class="shell">

  <footer class="app-footer">Konart Steel Buildings Pvt. Ltd. — We Commit…. We Deliver</footer>
  ${App.toast ? `<div class="toast" id="toast">${escapeHtml(App.toast)}</div>` : ''}

function renderStep(key, insp) {
  switch (key) {
    case 'site': return renderSiteStep(insp);
    case 'people': return renderPeopleStep(insp);
    case 'identity': return renderIdentityStep(insp);
    case 'sec1': case 'sec2': case 'sec3': case 'sec5': case 'sec6':
      return renderChecklistStep(key, insp);
    case 'observations': return renderObservationsStep(insp);
    case 'summary': return renderSummaryStep(insp);
    case 'submit': return renderSubmitStep(insp);
    default: return '';
  }
}

/* ---------- Step: Site Information ---------- */
function field(label, key, opts) {
  opts = opts || {};
  const type = opts.type || 'text';
  const val = opts.value == null ? '' : opts.value;
  const req = opts.required ? '<span class="req">*</span>' : '';
  const bind = opts.bind || `site.${key}`;
  if (type === 'select') {
    return `<label class="field">
      <span class="field-label">${label}${req}</span>
      <select data-bind="${bind}">
        ${opts.options.map((o) => `<option value="${o}" ${o === val ? 'selected' : ''}>${o || 'Select\u2026'}</option>`).join('')}
      </select>
    </label>`;
  }
  if (type === 'textarea') {
    return `<label class="field field-wide">
      <span class="field-label">${label}${req}</span>
      <textarea data-bind="${bind}" rows="2" placeholder="${opts.placeholder || ''}">${escapeHtml(val)}</textarea>
    </label>`;
  }
  return `<label class="field">
    <span class="field-label">${label}${req}</span>
    <input type="${type}" data-bind="${bind}" value="${escapeHtml(val)}" placeholder="${opts.placeholder || ''}" />
  </label>`;
}

function renderSiteStep(insp) {
  const s = insp.site;
  return `
  <h3 class="step-title">Site Information</h3>
  <p class="step-desc">Fields marked <span class="req">*</span> are required before final submission. Drafts can be saved with partial data.</p>
  <div class="field-grid">
    ${field('Site Name and No.', 'siteNameNo', { value: s.siteNameNo, required: true, placeholder: 'e.g. KS-1463' })}
    ${field('Client', 'client', { value: s.client, required: true })}
    ${field('Project / Work Order No.', 'workOrderNo', { value: s.workOrderNo })}
    ${field('Location', 'location', { value: s.location, required: true })}
    ${field('Inspection Date & Time', 'datetime', { type: 'datetime-local', value: s.datetime, required: true })}
    ${field('No. of Workers', 'workersCount', { type: 'number', value: s.workersCount })}
    ${field('Contractor / Erector Name', 'contractor', { value: s.contractor })}
    ${field('Shift', 'shift', { type: 'select', value: s.shift, options: ['Day', 'Night'] })}
    ${field('Weather Condition', 'weather', { type: 'select', value: s.weather, options: [''].concat(WEATHER_OPTIONS) })}
    ${field('Work Activity / Activities', 'activities', { type: 'textarea', value: s.activities, placeholder: 'Brief description of activities in progress' })}
  </div>
  `;
}

/* ---------- Step: Responsible Persons ---------- */
function personBlock(insp, role) {
  const key = PERSON_KEY[role];
  const p = insp.people[key];
  return `
  <div class="person-block">
    <h4 class="person-role-title">${role}</h4>
    <div class="field-grid tight">
      ${field('Name', null, { value: p.name, required: true, bind: `people.${key}.name` })}
      ${field('Email', null, { type: 'email', value: p.email, required: true, bind: `people.${key}.email`, placeholder: 'name@company.com' })}
    </div>
  </div>`;
}

function renderPeopleStep(insp) {
  return `
  <h3 class="step-title">Responsible Persons</h3>
  <p class="step-desc">Enter the two people responsible for this inspection. Whichever one actually fills out the checklist is selected on the next step — whoever that is is treated as having carried out the inspection.</p>
  ${personBlock(insp, 'Safety Incharge')}
  ${personBlock(insp, 'Site Incharge')}
  `;
}

/* ---------- Step: Who's Filling This ---------- */
function peopleComplete(insp) {
  return FILLER_ROLES.every((r) => {
    const p = insp.people[PERSON_KEY[r]];
    return p.name.trim() && p.email.trim();
  });
}

function renderIdentityStep(insp) {
  const f = insp.filler || { role: '' };
  const confirmed = !!f.role;
  if (!peopleComplete(insp)) {
    return `
    <h3 class="step-title">Who's Filling This Checklist?</h3>
    <div class="notice notice-warn">Enter the name and email for both Responsible Persons on the previous step first — this step picks one of them as whoever is filling this checklist right now.</div>
    `;
  }
  return `
  <h3 class="step-title">Who's Filling This Checklist?</h3>
  <p class="step-desc">Whoever fills this checklist is treated as the one physically carrying out the inspection right now — "Inspected by" is automatically approved under their name. Only the other person then needs to approve remotely.</p>

  <label class="field field-wide">
    <span class="field-label">Who is filling this checklist?<span class="req">*</span></span>
    <select id="filler-role-select">
      <option value="" ${!f.role ? 'selected' : ''}>Select…</option>
      ${FILLER_ROLES.map((r) => `<option value="${r}" ${f.role === r ? 'selected' : ''}>${r} — ${escapeHtml(insp.people[PERSON_KEY[r]].name || '(no name yet)')}</option>`).join('')}
    </select>
  </label>
  <button class="btn btn-primary" data-action="confirm-identity" style="margin-top:10px;">Confirm</button>

  ${confirmed ? `
  <div class="notice notice-ok" style="margin-top:16px;">
    ${verifiedBadge(18)} Filling as <strong>${escapeHtml(f.role)}</strong> — <strong>${escapeHtml(insp.people[PERSON_KEY[f.role]].name)}</strong>.
    ${renderMiniBatchPreview(insp)}
  </div>` : ''}
  `;
}

function renderMiniBatchPreview(insp) {
  if (!insp.filler.role) return '';
  const batch = computeApprovalBatch(insp);
  return `<div class="mini-batch">${batch.map((b) => `<span class="mini-batch-row">${b.role}: <strong>${b.status === 'APPROVED' ? 'Approved ✓' : 'Approval required'}</strong></span>`).join('')}</div>`;
}

/* ---------- Step: Checklist sections ---------- */
function renderChecklistStep(sectionId, insp) {
  const section = CHECKLIST_SECTIONS.find((s) => s.id === sectionId);
  const items = insp.checklist[sectionId];
  return `
  <h3 class="step-title">${section.title}</h3>
  <p class="step-desc">Select Yes, No or N/A for each point. If No is selected, record the finding and corrective action.</p>
  <div class="check-list">
    ${items.map((it, idx) => renderChecklistCard(sectionId, idx, it)).join('')}
  </div>
  `;
}

function renderChecklistCard(sectionId, idx, it) {
  const flagged = it.result === 'NO';
  return `
  <div class="check-card ${flagged ? 'flagged' : ''}" data-sec="${sectionId}" data-idx="${idx}">
    <div class="check-card-head">
      <span class="check-no">${it.no}</span>
      <p class="check-text">${escapeHtml(it.text)}</p>
    </div>
    <div class="segmented" role="group" aria-label="Result for ${it.no}">
      <button type="button" class="seg seg-yes ${it.result === 'YES' ? 'active' : ''}" data-action="set-result" data-sec="${sectionId}" data-idx="${idx}" data-val="YES">YES</button>
      <button type="button" class="seg seg-no ${it.result === 'NO' ? 'active' : ''}" data-action="set-result" data-sec="${sectionId}" data-idx="${idx}" data-val="NO">NO</button>
      <button type="button" class="seg seg-na ${it.result === 'NA' ? 'active' : ''}" data-action="set-result" data-sec="${sectionId}" data-idx="${idx}" data-val="NA">N/A</button>
    </div>
    <label class="field field-wide">
      <span class="field-label">Remarks / Findings</span>
      <textarea rows="1" data-bind="checklist.${sectionId}.${idx}.remarks" placeholder="Optional remarks">${escapeHtml(it.remarks)}</textarea>
    </label>
    ${flagged ? `
    <div class="no-panel">
      <p class="no-flag">⚠ Observation / corrective action recommended.</p>
      <div class="field-grid tight">
        <label class="field field-wide">
          <span class="field-label">Corrective Action</span>
          <textarea rows="1" data-bind="checklist.${sectionId}.${idx}.correctiveAction" placeholder="What needs to be done">${escapeHtml(it.correctiveAction)}</textarea>
        </label>
        <label class="field">
          <span class="field-label">Responsible Person</span>
          <input type="text" data-bind="checklist.${sectionId}.${idx}.responsible" value="${escapeHtml(it.responsible)}" />
        </label>
        <label class="field">
          <span class="field-label">Target Date</span>
          <input type="date" data-bind="checklist.${sectionId}.${idx}.targetDate" value="${escapeHtml(it.targetDate)}" />
        </label>
        <label class="field">
          <span class="field-label">Status</span>
          <select data-bind="checklist.${sectionId}.${idx}.status">
            ${['Open', 'In Progress', 'Closed'].map((o) => `<option ${o === it.status ? 'selected' : ''}>${o}</option>`).join('')}
          </select>
        </label>
      </div>
    </div>` : ''}
  </div>`;
}


/* ---------- Step: Observations ---------- */
function renderObservationsStep(insp) {
  syncAutoObservations(insp);
  const rows = insp.observations;
  return `
  <h3 class="step-title">Observations / Non-Conformances & Corrective Actions</h3>
  <p class="step-desc">Rows marked <em>Auto</em> come from checklist points answered No. Add any additional observation below.</p>
  <div class="obs-list">
    ${rows.length === 0 ? '<p class="muted">No observations recorded.</p>' : rows.map((o, idx) => `
    <div class="obs-card">
      <div class="obs-card-head">
        <span class="obs-tag ${o.source === 'auto' ? 'tag-auto' : 'tag-manual'}">${o.source === 'auto' ? 'Auto · ' + o.itemNo : 'Manual'}</span>
        ${o.source !== 'auto' ? `<button class="btn-link danger" data-action="remove-obs" data-id="${o.id}">Remove</button>` : ''}
      </div>
      <div class="field-grid tight">
        <label class="field field-wide">
          <span class="field-label">Observation / Non-Conformance</span>
          <textarea rows="1" data-bind-obs="${o.id}.text">${escapeHtml(o.text)}</textarea>
        </label>
        <label class="field field-wide">
          <span class="field-label">Corrective Action Required</span>
          <textarea rows="1" data-bind-obs="${o.id}.correctiveAction">${escapeHtml(o.correctiveAction)}</textarea>
        </label>
        <label class="field">
          <span class="field-label">Responsible Person</span>
          <input type="text" data-bind-obs="${o.id}.responsible" value="${escapeHtml(o.responsible)}" />
        </label>
        <label class="field">
          <span class="field-label">Target Date</span>
          <input type="date" data-bind-obs="${o.id}.targetDate" value="${escapeHtml(o.targetDate)}" />
        </label>
        <label class="field">
          <span class="field-label">Status</span>
          <select data-bind-obs="${o.id}.status">
            ${['Open', 'In Progress', 'Closed'].map((s2) => `<option ${s2 === o.status ? 'selected' : ''}>${s2}</option>`).join('')}
          </select>
        </label>
      </div>
    </div>`).join('')}
  </div>
  <button class="btn btn-outline" data-action="add-obs">+ ADD OBSERVATION</button>
  `;
}

/* ---------- Step: Summary & Declaration ---------- */
function renderSummaryStep(insp) {
  const sum = computeSummary(insp);
  return `
  <h3 class="step-title">Inspection Summary</h3>
  <div class="summary-grid">
    <div class="sum-card"><span class="sum-num">${sum.total}</span><span class="sum-label">Total Points</span></div>
    <div class="sum-card good"><span class="sum-num">${sum.yes}</span><span class="sum-label">Yes</span></div>
    <div class="sum-card bad"><span class="sum-num">${sum.no}</span><span class="sum-label">No</span></div>
    <div class="sum-card neutral"><span class="sum-num">${sum.na}</span><span class="sum-label">N/A</span></div>
    <div class="sum-card accent"><span class="sum-num">${sum.compliance}%</span><span class="sum-label">Compliance</span></div>
    <div class="sum-card"><span class="sum-num">${sum.open}</span><span class="sum-label">Open Observations</span></div>
    <div class="sum-card"><span class="sum-num">${sum.closed}</span><span class="sum-label">Closed Observations</span></div>
  </div>
  ${sum.blank > 0 ? `<p class="warn-line">⚠ ${sum.blank} checklist point(s) not yet answered.</p>` : ''}
  `;
}

/* ---------- Step: Submit / Approval & Verification ---------- */
function renderSubmitStep(insp) {
  const missing = validateRequired(insp);
  recomputeStatus(insp);
  const batch = computeApprovalBatch(insp);
  const finalLabel = finalStatusLabel(insp);

  return `
  <h3 class="step-title">Approval &amp; Verification</h3>

  ${missing.length ? `
  <div class="notice notice-warn">
    <strong>Before this can be sent for approval, please complete:</strong>
    <ul>${missing.map((m) => `<li>${escapeHtml(m)}</li>`).join('')}</ul>
  </div>` : `<div class="notice notice-ok">All required fields and checklist points are complete.</div>`}

  <div class="notice ${Backend.configured() ? 'notice-ok' : 'notice-info'}">
    ${Backend.configured()

        ${h.comment ? `<div class="muted small" style="width:100%;">Comment: ${escapeHtml(h.comment)}</div>` : ''}

function renderBatchRow(b, insp) {
  const icon = statusBadgeIcon(b.status, 20);
  return `
  <div class="batch-row batch-${b.status.toLowerCase()}">
    <div class="batch-info">
      <div class="batch-role">${escapeHtml(b.role)}${b.alsoInspected ? ' <span class="muted small">(also Inspected By)</span>' : ''}</div>
      <div class="batch-name-line">
        <span class="batch-name">${escapeHtml(b.name || '—')}</span>
        <span class="batch-name-icon">${icon}</span>
      </div>
      <div class="batch-status-text">${b.status === 'APPROVED' ? 'Approved ✓' : b.status === 'REJECTED' ? 'Rejected ✕' : 'Pending Approval'}</div>
      ${b.status === 'APPROVED' && b.respondedDate ? `<div class="muted small">${b.note || ''} ${b.respondedDate} ${b.respondedTime}</div>` : ''}
      ${b.status === 'REJECTED' && b.reason ? `<div class="muted small">Reason: ${escapeHtml(b.reason)}</div>` : ''}
      ${b.requirement === 'remote' ? `
      <div class="batch-actions">
        ${b.sent ? `<code class="approval-code">Code: ${b.approvalId}</code>` : ''}
        ${!b.sent ? `<button class="btn btn-outline btn-sm" data-action="send-role-approval" data-role="${escapeHtml(b.role)}">Send Approval Request</button>` : ''}
        ${b.sent && b.status === 'PENDING' ? (
          Backend.configured()
            ? `<span class="muted small">✉ Emailed to ${escapeHtml(b.email)}</span>`
            : `<a class="btn btn-outline btn-sm" href="${escapeHtml(mailtoHref({ id: b.approvalId, role: b.role, email: b.email }, insp))}" target="_blank" rel="noopener">✉ Compose Email</a>`
        ) : ''}
        ${b.sent && b.status === 'PENDING' ? `<button class="btn btn-ghost btn-sm" data-action="copy-html-summary" data-role="${escapeHtml(b.role)}">📋 Copy HTML</button>` : ''}
        ${b.sent && b.status === 'PENDING' ? `<button class="btn btn-ghost btn-sm" data-action="goto-inbox-code" data-code="${b.approvalId}">Open in Inbox</button>` : ''}
      </div>
      ${b.sent && b.status === 'PENDING' ? `<p class="muted small" style="margin:6px 0 0;">Compose Email opens your mail app with plain text (mailto: can\u2019t carry rich formatting). Copy HTML instead for a formatted version to paste into a new email.</p>` : ''}
      ${b.sent && b.emailDevMode ? `<div class="notice notice-warn" style="margin-top:8px; margin-bottom:0;">⚠ Your server has no <code>RESEND_API_KEY</code> set — this request was only logged on the server, not actually emailed. Share the code above directly, or set up real email (see backend README) and send again.</div>` : ''}
      ` : ''}
    </div>
  </div>`;
}

function getByPath(obj, path) {
  return path.split('.').reduce((o, k) => (o == null ? o : o[k]), obj);
}
function setByPath(obj, path, value) {
  const parts = path.split('.');
  let o = obj;
  for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]];
  o[parts[parts.length - 1]] = value;
}

function attachGlobalListeners() {
  const r = root();

  r.oninput = (e) => {
    const bind = e.target.getAttribute('data-bind');
    const bindObs = e.target.getAttribute('data-bind-obs');
    if (bind && App.current) {
      setByPath(App.current, bind, e.target.value);
    } else if (bindObs && App.current) {
      const obsId = bindObs.split('.')[0];
      const field2 = bindObs.split('.').slice(1).join('.');
      const row = App.current.observations.find((o) => o.id === obsId);
      if (row) row[field2] = e.target.value;
    } else if (e.target.id === 'f-search') {
      App.filters.search = e.target.value;
      renderDashboardTableOnly();
    } else if (e.target.id === 'inbox-code') {
      App.inboxCodeInput = e.target.value;
    } else if (e.target.id === 'decision-name') {
      App.inboxDecisionName = e.target.value;
    } else if (e.target.id === 'reject-reason') {
      App.inboxRejectReason = e.target.value;
    } else if (e.target.id === 'approve-comment') {
      App.inboxApproveComment = e.target.value;
    } else if (e.target.id === 'set-api-url') {
      App.settingsDraft.apiBaseUrl = e.target.value;
    } else if (e.target.id === 'set-api-key') {
      App.settingsDraft.apiKey = e.target.value;
    }
  };

  r.onchange = (e) => {
    const bind = e.target.getAttribute('data-bind');
    if (bind && App.current) {
      setByPath(App.current, bind, e.target.value);
      if (bind.includes('.status') || bind.includes('.result')) render();
    }
    if (e.target.id === 'f-status') {
      App.filters.status = e.target.value;
      render();
    }
  };

  const NAV_ACTIONS = new Set(['go-inbox', 'go-settings', 'go-dashboard', 'edit-insp', 'new-inspection']);
  const runNav = (action, btn, e) => {
    App.navBusy = true;
    Promise.resolve(handleAction(action, btn, e)).finally(() => {
      App.navBusy = false;
      if (App.pendingNav) {
        const next = App.pendingNav;
        App.pendingNav = null;
        runNav(next.action, next.btn, next.e);
      }
    });
  };
  r.onclick = (e) => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const action = btn.getAttribute('data-action');
    if (NAV_ACTIONS.has(action)) {
      // Guard against rapid taps firing overlapping saves/loads — on a real
      // device, storage round-trips take real time, so tapping between tabs
      // quickly could otherwise race a save against a reload. Rather than
      // just dropping extra taps (which would leave you stuck on the wrong
      // screen), we queue only the most recent one and run it the moment
      // the in-flight save/load finishes, so you always end up where you
      // actually tapped last.
      if (App.navBusy) { App.pendingNav = { action, btn, e }; return; }
      runNav(action, btn, e);
      return;
    }
    handleAction(action, btn, e);
  };
}

function renderDashboardTableOnly() {
  // lightweight: full render is cheap enough for this dataset size
  render();
}

async function handleAction(action, btn, e) {
  const insp = App.current;
  switch (action) {
    case 'new-inspection': newInspectionAndEdit(); break;
    case 'go-dashboard': {
      if (App.current) await persistCurrentDraft(true);
      goDashboard();
      break;
    }
    case 'edit-insp': await editInspection(btn.getAttribute('data-id')); break;
    case 'delete-insp': {
      if (confirm('Delete this inspection permanently?')) await deleteInspection(btn.getAttribute('data-id'));
      break;
    }
    case 'pdf-insp': {
      const rec = await Store.loadInspection(btn.getAttribute('data-id'));
      if (rec) buildPDF(rec);
      break;
    }
    case 'go-step': {
      const target = Number(btn.getAttribute('data-step'));
      if (target > App.step) {
        const missingHere = stepMissingFields(insp, WIZARD_STEPS[App.step].key);
        if (missingHere.length) {
          showToast('Please complete this page first: ' + missingHere[0] + (missingHere.length > 1 ? ` (+${missingHere.length - 1} more)` : ''));
          render(); scrollToTop(); break;
        }
      }
      App.step = target; insp.lastStep = App.step; render(); scrollToTop(); break;
    }
    case 'prev-step': if (App.step > 0) { App.step--; insp.lastStep = App.step; render(); scrollToTop(); } break;
    case 'next-step': {
      const missingHere = stepMissingFields(insp, WIZARD_STEPS[App.step].key);
      if (missingHere.length) {
        showToast('Please complete this page first: ' + missingHere[0] + (missingHere.length > 1 ? ` (+${missingHere.length - 1} more)` : ''));
        break;
      }
      if (App.step < WIZARD_STEPS.length - 1) { App.step++; insp.lastStep = App.step; render(); scrollToTop(); }
      break;
    }

    case 'set-result': {
      const sec = btn.getAttribute('data-sec'), idx = Number(btn.getAttribute('data-idx')), val = btn.getAttribute('data-val');
      const it = insp.checklist[sec][idx];
      it.result = (it.result === val) ? '' : val;
      if (it.result !== 'NO') { it.status = 'Open'; }
      render();
      break;
    }
    case 'confirm-identity': {
      const role = document.getElementById('filler-role-select').value;
      if (!role) { showToast('Select who is filling this checklist.'); break; }
      applyIdentity(insp, role);
      await persistCurrentDraft(true);
      render();
      showToast(`Confirmed — filling as ${role}.`);
      break;
    }

    case 'add-obs': {
      insp.observations.push({ id: uid('obs'), source: 'manual', itemNo: '', text: '', correctiveAction: '', responsible: '', targetDate: '', status: 'Open' });
      render();
      break;
    }
    case 'remove-obs': {
      insp.observations = insp.observations.filter((o) => o.id !== btn.getAttribute('data-id'));
      render();
      break;
    }
    case 'save-draft': await persistCurrentDraft(false); break;
    case 'preview-pdf': {
      await ensureReferenceCode(insp);
      await persistCurrentDraft(true);
      buildPDF(insp, { preview: true });
      break;
    }
    case 'generate-pdf': {
      syncAutoObservations(insp);
      await ensureReferenceCode(insp);
      await persistCurrentDraft(true);
      buildPDF(insp, { preview: false });
      showToast('PDF generated: ' + pdfFileName(insp));
      break;
    }
    case 'goto-submit-step': App.step = WIZARD_STEPS.length - 1; render(); break;

    case 'send-role-approval': {
      const role = btn.getAttribute('data-role');
      const missing = validateRequired(insp);
      if (missing.length) { showToast('Complete required fields before sending for approval.'); break; }
      const person = insp.people[PERSON_KEY[role]];
      if (!person.email) { showToast('That person needs an email address — check the Responsible Persons step.'); break; }
      const snapshot = buildApprovalSnapshot(insp, role);
      const requesterEmail = insp.filler.role ? insp.people[PERSON_KEY[insp.filler.role]].email : '';
      let created;
      try {
        created = await Store.createApprovalRequest({
          inspectionId: insp.id, role, email: person.email, snapshot, requesterEmail,
        });
      } catch (e) {
        showToast('Could not create approval request: ' + e.message);
        break;
      }
      insp.approvals = insp.approvals.filter((a) => a.role !== role);
      insp.approvals.push({
        id: created.id, role, email: person.email, status: 'PENDING',
        requestedDate: created.requestedDate, requestedTime: created.requestedTime,
        respondedName: '', respondedDate: '', respondedTime: '', reason: '',
        emailDevMode: !!created.emailDevMode, emailSent: !!created.emailSent,
      });
      const stamp = nowStamp();
      insp.approvalHistory.push({ role, name: '', status: 'PENDING', date: stamp.date, time: stamp.time, note: 'Approval request sent — code ' + created.id });
      recomputeStatus(insp);
      await persistCurrentDraft(true);
      render();
      if (Backend.configured()) {
        if (created.emailDevMode) {
          showToast(`Request created — but your server has no RESEND_API_KEY set, so no real email was sent (just logged). See backend README.`);
        } else if (created.emailSent) {
          showToast(`Email sent to ${person.email}.`);
        } else {
          showToast('Request created, but the email failed to send — check your backend logs.');
        }
      } else {
        showToast('Approval request created. Use Compose Email to notify them.');
      }
      break;
    }
    case 'refresh-approvals': {
      if (!insp.approvals.length) { showToast('No approval requests sent yet.'); break; }
      for (const ap of insp.approvals) {
        const shared = await Store.loadApprovalRequest(ap.id);
        if (shared && shared.status !== ap.status) {
          ap.status = shared.status;
          ap.respondedName = shared.respondedName || '';
          ap.respondedDate = shared.respondedDate || '';
          ap.respondedTime = shared.respondedTime || '';
          ap.reason = shared.reason || '';
          ap.comment = shared.comment || '';
          insp.approvalHistory.push({
            role: ap.role, name: ap.respondedName, status: ap.status,
            date: ap.respondedDate || nowStamp().date, time: ap.respondedTime || nowStamp().time,
            reason: ap.reason, comment: ap.comment,
          });
        }
      }
      recomputeStatus(insp);
      await persistCurrentDraft(true);
      render();
      showToast('Approval status updated.');
      break;
    }
    case 'copy-html-summary': {
      const role = btn.getAttribute('data-role');
      const approvalRow = insp.approvals.find((a) => a.role === role);
      if (!approvalRow) { showToast('No approval request found for that role yet.'); break; }
      const html = buildHtmlApprovalRequest(insp, approvalRow);
      const plain = buildPlainApprovalRequest(insp, approvalRow);
      try {
        if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], { type: 'text/html' }),
              'text/plain': new Blob([plain], { type: 'text/plain' }),
            }),
          ]);
          showToast('Copied — paste into a new email for a formatted message.');
        } else if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(plain);
          showToast('Your browser can only copy plain text here — copied a plain-text version instead.');
        } else {
          throw new Error('Clipboard API unavailable');
        }
      } catch (e) {
        showToast('Could not copy automatically — your browser may need clipboard permission.');
      }
      break;
    }
    case 'mark-completed': {
      insp.status = 'COMPLETED';
      await persistCurrentDraft(true);
      render();
      showToast('Inspection marked Completed.');
      break;
    }
    case 'goto-inbox-code': {
      await persistCurrentDraft(true);
      App.view = 'inbox';
      App.inboxCodeInput = btn.getAttribute('data-code');
      await loadInboxAndOpen(App.inboxCodeInput);
      break;
    }
    case 'go-inbox': await goInbox(); break;
    case 'go-settings': {
      if (App.current) await persistCurrentDraft(true);
      App.settingsDraft = Object.assign({}, App.settings);
      App.view = 'settings';
      render();
      break;
    }
    case 'save-settings': {
      App.settings = { apiBaseUrl: normalizeBackendUrl(App.settingsDraft.apiBaseUrl), apiKey: App.settingsDraft.apiKey.trim() };
      App.settingsDraft = Object.assign({}, App.settings);
      await Backend.saveSettings(App.settings);
      App.inspections = await Store.loadAll();
      render();
      showToast(App.settings.apiBaseUrl ? 'Backend connected.' : 'Settings saved.');
      break;
    }
    case 'test-connection': {
      const apiBaseUrl = App.settingsDraft.apiBaseUrl.trim();
      if (!apiBaseUrl) { showToast('Enter a Backend URL first.'); break; }
      const result = await Backend.testConnection(apiBaseUrl, App.settingsDraft.apiKey.trim());
      if (result.ok) {
        showToast('✓ Connection successful — URL and API Key both work.');
      } else if (result.reason === 'unreachable') {
        showToast('✗ Could not reach that URL. Check it\u2019s correct and the server is awake.');
      } else if (result.reason === 'unauthorized') {
        showToast('✗ Reached the server, but the API Key is wrong or missing. Re-copy it from Render\u2019s Environment tab.');
      } else {
        showToast('✗ Connected, but the server returned an unexpected error.');
      }
      break;
    }
    case 'clear-settings': {
      App.settings = { apiBaseUrl: '', apiKey: '' };
      App.settingsDraft = { apiBaseUrl: '', apiKey: '' };
      await Backend.saveSettings(App.settings);
      App.inspections = await Store.loadAll();
      render();
      showToast('Disconnected — back to local demo mode.');
      break;
    }
    case 'inbox-open-code': {
      const code = btn.getAttribute('data-code') || (document.getElementById('inbox-code') || {}).value || '';
      if (!code.trim()) { showToast('Enter an Approval Code first.'); break; }
      App.inboxCodeInput = code.trim();
      await loadInboxAndOpen(code.trim());
      break;
    }
    case 'decide-start-approve': {
      const nameEl = document.getElementById('decision-name');
      const name = nameEl ? nameEl.value.trim() : '';
      if (!name) { showToast('Please enter your name first.'); break; }
      App.inboxDecisionName = name;
      App.inboxPhase = 'confirmApprove';
      render();
      break;
    }
    case 'decide-start-reject': {
      const nameEl = document.getElementById('decision-name');
      const name = nameEl ? nameEl.value.trim() : '';
      if (!name) { showToast('Please enter your name first.'); break; }
      App.inboxDecisionName = name;
      App.inboxPhase = 'confirmReject';
      render();
      break;
    }
    case 'decide-cancel': {
      App.inboxPhase = 'review';
      render();
      break;
    }
    case 'decide-confirm-approve': {
      const commentEl = document.getElementById('approve-comment');
      const comment = commentEl ? commentEl.value.trim() : '';
      App.inboxApproveComment = comment;
      try {
        const updated = await Store.decideApprovalRequest(App.inboxDetail.id, App.inboxDecisionName, 'APPROVED', '', comment);
        App.inboxDetail = updated || App.inboxDetail;
      } catch (e) {
        const fresh = await Store.loadApprovalRequest(App.inboxDetail.id);
        if (fresh) App.inboxDetail = fresh;
        App.inboxPhase = 'review';
        render();
        showToast('Could not record your decision: ' + e.message);
        break;
      }
      App.inboxPhase = 'review';
      render();
      showToast('Approved. A verified checkmark will show once the requester refreshes.');
      break;
    }
    case 'decide-confirm-reject': {
      const reasonEl = document.getElementById('reject-reason');
      const reason = reasonEl ? reasonEl.value.trim() : '';
      if (!reason) { showToast('Please enter a reason for rejection.'); break; }
      App.inboxRejectReason = reason;
      try {
        const updated = await Store.decideApprovalRequest(App.inboxDetail.id, App.inboxDecisionName, 'REJECTED', reason);
        App.inboxDetail = updated || App.inboxDetail;
      } catch (e) {
        const fresh = await Store.loadApprovalRequest(App.inboxDetail.id);
        if (fresh) App.inboxDetail = fresh;
        App.inboxPhase = 'review';
        render();
        showToast('Could not record your decision: ' + e.message);
        break;
      }
      App.inboxPhase = 'review';
      render();
      showToast('Rejected — the reason has been recorded.');
      break;
    }
    case 'reset-form': {
      if (confirm('Reset this inspection form? All unsaved entries will be lost.')) {
        App.current = newInspection();
        App.step = 0;
        render();
      }
      break;
    }
    default: break;
  }
}
