/* =========================================================================
   PDF GENERATION (jsPDF)
   ========================================================================= */
function buildPDF(insp, opts) {
  opts = opts || {};
  if (!window.jspdf) { alert('PDF library did not load. Check your connection and try again.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const pageW = 210, pageH = 297, margin = 14, topMargin = 10, bottomMargin = 10;
  const usableW = pageW - 2 * margin;
  const NAVY = [11, 41, 71], ORANGE = [193, 68, 14], GREEN = [24, 110, 60], RED = [190, 50, 30],
        TEXTC = [37, 37, 37], BORDER = [213, 216, 221], ALT = [241, 242, 248], MUTED = [110, 114, 120];
  let y = topMargin, pageNum = 1;

  function setText() { doc.setTextColor(TEXTC[0], TEXTC[1], TEXTC[2]); }

  function addHeader() {
    // Logo, upper-left, aspect ratio preserved (source art is 1536x463).
    const logoW = 36, logoH = logoW * (463 / 1536);
    try { doc.addImage(LOGO_DATA_URI, 'PNG', margin, topMargin, logoW, logoH, undefined, 'FAST'); } catch (e) { /* ignore */ }

    // Company name + tagline, upper-right.
    doc.setFont('helvetica', 'bold'); doc.setFontSize(12.5);
    doc.setTextColor(NAVY[0], NAVY[1], NAVY[2]);
    doc.text('KONART STEEL BUILDINGS PVT. LTD.', pageW - margin, topMargin + 5, { align: 'right' });
    doc.setFont('helvetica', 'italic'); doc.setFontSize(8.5);
    doc.setTextColor(GREEN[0], GREEN[1], GREEN[2]);
    doc.text('We Commit.... We Deliver', pageW - margin, topMargin + 10.5, { align: 'right' });

    // Reference code — immediately below the tagline, small and subtle.
    if (insp.referenceCode) {
      doc.setFont('helvetica', 'italic'); doc.setFontSize(6.8);
      doc.setTextColor(120, 124, 130);
      doc.text(`Reference Sequence: ${formatReferenceCode(insp.referenceCode)}`, pageW - margin, topMargin + 14.5, { align: 'right' });
    }

    // Title banner — full-width dark navy.
    const bannerTop = topMargin + 21, bannerH = 16;
    doc.setFillColor(NAVY[0], NAVY[1], NAVY[2]);
    doc.rect(margin, bannerTop, usableW, bannerH, 'F');
    doc.setTextColor(255, 255, 255);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(13.5);
    doc.text('DAILY SITE SAFETY INSPECTION CHECKLIST', pageW / 2, bannerTop + 7.5, { align: 'center' });
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5);
    doc.setTextColor(255, 205, 178);
    doc.text('General \u2013 Project Sites', pageW / 2, bannerTop + 13, { align: 'center' });

    y = bannerTop + bannerH + 6;
    setText();
  }

  function addFooter() {
    doc.setDrawColor(BORDER[0], BORDER[1], BORDER[2]);
    doc.line(margin, pageH - bottomMargin - 6, pageW - margin, pageH - bottomMargin - 6);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(6.5);
    doc.setTextColor(MUTED[0], MUTED[1], MUTED[2]);
    doc.text('Konart Steel Buildings Pvt. Ltd. \u2014 Daily Site Safety Inspection Checklist', margin, pageH - bottomMargin - 2);
    doc.text(`Page ${pageNum}`, pageW - margin, pageH - bottomMargin - 2, { align: 'right' });
  }

  function ensureSpace(h) {
    if (y + h > pageH - bottomMargin - 10) {
      addFooter();
      doc.addPage();
      pageNum++;
      y = topMargin;
      addHeader();
    }
  }

  function sectionHeader(title) {
    ensureSpace(10);
    doc.setFillColor(NAVY[0], NAVY[1], NAVY[2]);
    doc.rect(margin, y, usableW, 8, 'F');
    doc.setTextColor(255, 255, 255);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5);
    doc.text(title.toUpperCase(), margin + 4, y + 5.4);
    y += 8 + 3;
    setText();
  }

  /* Generic wrapped-text row drawer used by every table in the document. */
  function drawRow(cells, widths, rowOpts) {
    rowOpts = rowOpts || {};
    const pad = 1.4, lh = 3.3, fs = rowOpts.header ? 7.8 : 7.3;
    doc.setFont('helvetica', rowOpts.header ? 'bold' : 'normal');
    doc.setFontSize(fs);
    const wrapped = cells.map((c, i) => doc.splitTextToSize(String(c == null ? '' : c), widths[i] - 2 * pad));
    const maxLines = Math.max(1, ...wrapped.map((w) => w.length));
    const rowH = Math.max(rowOpts.minH || 6.5, maxLines * lh + 2 * pad);
    ensureSpace(rowH);
    let x = margin;
    doc.setDrawColor(BORDER[0], BORDER[1], BORDER[2]);
    widths.forEach((w) => {
      if (rowOpts.header) doc.setFillColor(NAVY[0], NAVY[1], NAVY[2]);
      else if (rowOpts.fillAlt) doc.setFillColor(ALT[0], ALT[1], ALT[2]);
      else doc.setFillColor(255, 255, 255);
      doc.rect(x, y, w, rowH, 'FD');
      x += w;
    });
    x = margin;
    wrapped.forEach((lines, i) => {
      if (rowOpts.header) doc.setTextColor(255, 255, 255);
      else if (rowOpts.colorFn && rowOpts.colorFn(i, cells[i])) {
        const c = rowOpts.colorFn(i, cells[i]);
        doc.setTextColor(c[0], c[1], c[2]);
      } else setText();
      lines.forEach((line, li) => doc.text(line, x + pad, y + pad + lh * (li + 1) - 1.1));
      x += widths[i];
    });
    y += rowH;
    setText();
  }

  const resultColor = (label) => (label === 'YES' ? GREEN : label === 'NO' ? RED : label === 'NA' ? MUTED : null);
  const statusColor = (s) => (s === 'Closed' ? GREEN : s === 'In Progress' ? [30, 80, 160] : [156, 110, 0]);

  /* ---------------- BUILD DOCUMENT ---------------- */
  addHeader();

  // SITE INFORMATION
  sectionHeader('Site Information');
  const s = insp.site;
  const dtParts = siteDateTimeParts(insp);
  const infoRows = [
    [`Site Name and No.:  ${s.siteNameNo || '\u2014'}`, `Client:  ${s.client || '\u2014'}`],
    [`Project / Work Order No.:  ${s.workOrderNo || '\u2014'}`, `Location:  ${s.location || '\u2014'}`],
    [`Date:  ${fmtDateDMY(dtParts.date)}`, `Time:  ${dtParts.time12 || '\u2014'}`],
    [`No. of Workers:  ${s.workersCount || '\u2014'}`, `Contractor / Erector:  ${s.contractor || '\u2014'}`],
    [`Shift:  ${s.shift || '\u2014'}`, `Weather Condition:  ${s.weather || '\u2014'}`],
    [`Safety Incharge:  ${insp.people.safetyIncharge.name || '\u2014'}`, `Site Incharge:  ${insp.people.siteIncharge.name || '\u2014'}`],
    [`Inspected By:  ${roleDisplayName(insp, 'Inspected by') || '\u2014'}`, `Filled By:  ${insp.filler.role || '\u2014'}`],
  ];
  const colW = usableW / 2;
  infoRows.forEach((pair) => drawRow(pair, [colW, colW], { minH: 7 }));
  drawRow([`Work Activity / Activities:  ${s.activities || '\u2014'}`], [usableW], { minH: 7 });
  y += 1.5;

  // CHECKLIST SECTIONS — "SECTION n —" prefix for the first three, bare
  // titles for the rest, matching the source document's own numbering.
  const checklistWidths = [10, 70, 16, 45, 41]; // No | Point | Result | Remarks | Corrective Action
  CHECKLIST_SECTIONS.forEach((sec, idx) => {
    const heading = idx < 3 ? `Section ${idx + 1} \u2014 ${sec.title}` : sec.title;
    sectionHeader(heading);
    drawRow(['No.', 'Inspection Point', 'Result', 'Remarks / Findings', 'Corrective Action'], checklistWidths, { header: true });
    insp.checklist[sec.id].forEach((it, i) => {
      drawRow(
        [it.no, it.text, it.result || '\u2014', it.remarks || '\u2014', it.result === 'NO' ? (it.correctiveAction || '\u2014') : '\u2014'],
        checklistWidths,
        { fillAlt: i % 2 === 1, colorFn: (ci) => (ci === 2 ? resultColor(it.result) : null) }
      );
    });
    y += 1.5;
  });

  // OBSERVATIONS / NON-CONFORMANCES
  sectionHeader('Observations / Non-Conformances & Corrective Actions');
  const obsWidths = [11, 45, 51, 27, 22, 26];
  if (insp.observations.length === 0) {
    drawRow(['No observations recorded.'], [usableW], { minH: 6.5 });
  } else {
    drawRow(['No.', 'Observation / NC', 'Corrective Action', 'Responsible', 'Target', 'Status'], obsWidths, { header: true });
    insp.observations.forEach((o, idx) => {
      drawRow(
        [String(idx + 1), o.text || '\u2014', o.correctiveAction || '\u2014', o.responsible || '\u2014', fmtDateDMY(o.targetDate), o.status],
        obsWidths, { fillAlt: idx % 2 === 1, colorFn: (ci) => (ci === 5 ? statusColor(o.status) : null) }
      );
    });
  }
  y += 1.5;

  // INSPECTION SUMMARY (first summary row — Yes/No/N/A counts)
  sectionHeader('Inspection Summary');
  const sum = computeSummary(insp);
  const sw4 = usableW / 4;
  drawRow([`Total Points: ${sum.total}`, `Yes: ${sum.yes}`, `No: ${sum.no}`, `N/A: ${sum.na}`], [sw4, sw4, sw4, sw4], { minH: 9 });
  y += 1.5;

  // Compliance summary row — bare, no header, appears before Approval & Verification
  drawRow(
    [`Compliance: ${sum.compliance}%`, `Open Obs.: ${sum.open}`, `Closed Obs.: ${sum.closed}`, `Total Obs.: ${insp.observations.length}`],
    [sw4, sw4, sw4, sw4], { minH: 9 }
  );
  y += 5;

  // APPROVAL & VERIFICATION — three columns: Site Incharge | Inspected by | Safety Incharge
  sectionHeader('Approval & Verification');
  const batch = computeApprovalBatch(insp);
  const findRole = (role) => batch.find((b) => b.role === role) || {};
  const siB = findRole('Site Incharge'), saB = findRole('Safety Incharge');
  const fillerName = insp.filler.role ? insp.people[PERSON_KEY[insp.filler.role]].name : '';
  const inspStatus = insp.filler.role ? 'APPROVED' : 'PENDING';
  const idStamp = insp.identityConfirmedAt || {};

  const gap3 = 6;
  const colW3 = (usableW - 2 * gap3) / 3;
  ensureSpace(32);
  const rowTop3 = y;
  const cols3 = [
    ['Site Incharge', siB.name, siB.status, siB.respondedDate, siB.respondedTime],
    ['Inspected by', fillerName, inspStatus, idStamp.date, idStamp.time],
    ['Safety Incharge', saB.name, saB.status, saB.respondedDate, saB.respondedTime],
  ];
  cols3.forEach(([label, name, status, dDate, dTime], i) => {
    const x = margin + i * (colW3 + gap3);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5);
    doc.setTextColor(NAVY[0], NAVY[1], NAVY[2]);
    doc.text(label, x, rowTop3 + 4);
    doc.setDrawColor(NAVY[0], NAVY[1], NAVY[2]);
    doc.setLineDashPattern([1, 1], 0);
    doc.line(x, rowTop3 + 6.5, x + colW3, rowTop3 + 6.5);
    doc.setLineDashPattern([], 0);

    doc.setFont('helvetica', 'bold'); doc.setFontSize(9);
    setText();
    const nameLines = doc.splitTextToSize(name || '\u2014', colW3 - 8);
    doc.text(nameLines[0] || '\u2014', x, rowTop3 + 12.5);

    if (status === 'APPROVED') {
      const iconCx = Math.min(x + doc.getTextWidth(nameLines[0] || '\u2014') + 4, x + colW3 - 2.5);
      const iconCy = rowTop3 + 11, r = 2.6;
      doc.setFillColor(ORANGE[0], ORANGE[1], ORANGE[2]);
      doc.circle(iconCx, iconCy, r, 'F');
      doc.setDrawColor(255, 255, 255); doc.setLineWidth(0.55);
      doc.line(iconCx - 1.1, iconCy + 0.1, iconCx - 0.1, iconCy + 1.1);
      doc.line(iconCx - 0.1, iconCy + 1.1, iconCx + 1.4, iconCy - 1.1);
      doc.setLineWidth(0.2);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(7.5);
      doc.setTextColor(ORANGE[0], ORANGE[1], ORANGE[2]);
      doc.text('Verified', x, rowTop3 + 18);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(7);
      doc.setTextColor(MUTED[0], MUTED[1], MUTED[2]);
      doc.text(`${dDate || ''} ${dTime || ''}`.trim(), x, rowTop3 + 22.5);
    } else if (status === 'REJECTED') {
      doc.setFont('helvetica', 'bold'); doc.setFontSize(7.5);
      doc.setTextColor(RED[0], RED[1], RED[2]);
      doc.text('Not Approved \u2715', x, rowTop3 + 18);
    } else {
      doc.setFont('helvetica', 'italic'); doc.setFontSize(8);
      doc.setTextColor(MUTED[0], MUTED[1], MUTED[2]);
      doc.text('Pending Approval', x, rowTop3 + 18);
    }
  });
  y = rowTop3 + 28;
  setText();

  // DECLARATION
  sectionHeader('Declaration');
  doc.setFont('helvetica', 'italic'); doc.setFontSize(9);
  doc.setTextColor(TEXTC[0], TEXTC[1], TEXTC[2]);
  const declText = 'I confirm that the above Daily Site Safety Inspection has been conducted and the observations/findings have been recorded based on the conditions observed at the site during the inspection.';
  const declLines = doc.splitTextToSize(declText, usableW - 4);
  ensureSpace(declLines.length * 4.6 + 6);
  doc.text(declLines, margin, y + 4);
  y += declLines.length * 4.6 + 10;
  setText();

  // FINAL STATUS — full-width banner
  const finalLabel = finalStatusLabel(insp);
  const finalColor = finalLabel === 'APPROVED' ? ORANGE : finalLabel === 'NOT APPROVED' ? RED : [138, 143, 152];
  const finalText = finalLabel === 'APPROVED' ? 'FINAL STATUS: APPROVED' : finalLabel === 'NOT APPROVED' ? 'FINAL STATUS: REJECTED' : 'FINAL STATUS: PENDING APPROVAL';
  ensureSpace(15);
  doc.setFillColor(finalColor[0], finalColor[1], finalColor[2]);
  doc.rect(margin, y, usableW, 11, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(12.5);
  doc.text(finalText, pageW / 2, y + 7.3, { align: 'center' });
  y += 11 + 6;
  setText();

  // APPROVAL HISTORY
  if (insp.approvalHistory.length) {
    sectionHeader('Approval History');
    const hw = [27, 33, 31, 20, 18, 53];
    drawRow(['Status', 'Role', 'Name', 'Date', 'Time', 'Note / Reason'], hw, { header: true });
    insp.approvalHistory.forEach((h, idx) => {
      drawRow([h.status, h.role, h.name || '\u2014', h.date, h.time, h.reason || h.comment || h.note || ''], hw, { fillAlt: idx % 2 === 1 });
    });
  }

  addFooter();

  const fname = pdfFileName(insp);
  if (opts.preview) {
    try { doc.output('dataurlnewwindow'); } catch (e) { doc.save(fname); }
  } else {
    doc.save(fname);
  }
}

/* Bootstrap */
window.addEventListener('DOMContentLoaded', init);

</script>
</body>
</html>
